<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="AI Chat Assistant - Telegram Web App powered by ChatGPT">
    <title>AI Chat Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="header">
            <div class="header-content">
                <div class="header-left">
                    <div class="bot-avatar" id="botAvatar">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="currentColor" opacity="0.3"/>
                            <path d="M9 8.5c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5S11.33 10 10.5 10 9 9.33 9 8.5zm5 0c0-.83.67-1.5 1.5-1.5s1.5.67 1.5 1.5-.67 1.5-1.5 1.5-1.5-.67-1.5-1.5zM12 17.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="header-info">
                        <h1 id="botName">AI Assistant</h1>
                        <span class="status-text" id="statusText">Online</span>
                    </div>
                </div>
                <div class="header-right">
                    <button class="icon-btn" id="clearBtn" title="Clear Chat">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                    <button class="icon-btn" id="modelBtn" title="Change Model">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Model Selector Modal -->
        <div class="modal-overlay" id="modelModal">
            <div class="modal">
                <h3>Select Model</h3>
                <div class="model-list">
                    <button class="model-option active" data-model="llama-3.1-8b-instant">
                        <span class="model-name">Llama 3.1 (8B)</span>
                        <span class="model-desc">Super fast & efficient</span>
                    </button>
                    <button class="model-option" data-model="llama-3.2-90b-vision-preview">
                        <span class="model-name">Llama 3.2 Vision (90B)</span>
                        <span class="model-desc">Supports image analysis</span>
                    </button>
                    <button class="model-option" data-model="llama-3.3-70b-versatile">
                        <span class="model-name">Llama 3.3 (70B)</span>
                        <span class="model-desc">Highly capable</span>
                    </button>
                    <button class="model-option" data-model="mixtral-8x7b-32768">
                        <span class="model-name">Mixtral 8x7B</span>
                        <span class="model-desc">Great for long context</span>
                    </button>
                    <button class="model-option" data-model="gemma2-9b-it">
                        <span class="model-name">Gemma 2 (9B)</span>
                        <span class="model-desc">Google's open model</span>
                    </button>
                </div>
                <button class="modal-close" id="closeModal">Cancel</button>
            </div>
        </div>

        <!-- Chat Area -->
        <main id="chatArea">
            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">
                    <div class="pulse-ring"></div>
                    <div class="welcome-avatar">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z" fill="currentColor"/>
                            <path d="M12 10c.55 0 1-.45 1-1V7c0-.55-.45-1-1-1s-1 .45-1 1v2c0 .55.45 1 1 1zm0 2c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z" fill="currentColor"/>
                        </svg>
                    </div>
                </div>
                <h2>AI Assistant</h2>
                <p>Powered by ChatGPT</p>
                <div class="quick-actions">
                    <button class="quick-action" data-prompt="Tell me a fun fact">🎯 Fun Fact</button>
                    <button class="quick-action" data-prompt="Write a short poem">✨ Write Poem</button>
                    <button class="quick-action" data-prompt="Explain quantum computing simply">🧠 Explain Topic</button>
                    <button class="quick-action" data-prompt="Help me with coding">💻 Code Help</button>
                </div>
            </div>

            <!-- Messages Container -->
            <div id="messagesContainer"></div>

            <!-- Typing Indicator -->
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-avatar">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/>
                    </svg>
                </div>
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </main>

        <!-- Input Area -->
        <footer id="inputArea">
            <div class="image-preview-container" id="imagePreviewContainer" style="display: none;">
                <img id="imagePreview" src="" alt="Preview">
                <button id="removeImageBtn" class="remove-img-btn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <div class="input-container">
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <label for="fileInput" id="attachBtn" class="icon-btn attach-btn" title="Attach Image" style="cursor: pointer;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </label>
                <textarea 
                    id="messageInput" 
                    placeholder="Type a message or paste image..." 
                    rows="1"
                    autocomplete="off"
                    autofocus
                ></textarea>
                <button id="sendBtn" class="send-btn" disabled>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
